site_name: MinerU
site_url: https://opendatalab.github.io/MinerU
repo_name: opendatalab/MinerU
repo_url: https://github.com/opendatalab/MinerU

# 历史材料与未采纳提案只在仓库保留；旧网址由构建钩子跳转，不进入搜索索引。
exclude_docs: |
  /archive/
  /proposals/
  /_hooks/
  /_redirects.json
  /requirements.txt
  /README.md
hooks:
  - docs/_hooks/redirects.py
validation:
  links:
    anchors: warn

theme:
  icon:
    repo: fontawesome/brands/github
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  logo: images/logo.png
  favicon: images/logo.png
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - navigation.expand
    - navigation.footer
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - toc.follow

extra:
  analytics:
    provider: google
    property: G-44K480CC48
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/opendatalab/MinerU
      name: GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/OpenDataLab_AI
      name: X-Twitter
    - icon: fontawesome/brands/discord
      link: https://discord.gg/Tdedn9GTXq
      name: Discord
    - icon: fontawesome/brands/weixin
      link: https://mineru.net/community-portal/?aliasId=3c430f94
      name: WeChat
    - icon: material/email
      link: mailto:OpenDataLab@pjlab.org.cn
      name: E-mail

copyright: © 2024 - 2026 MinerU. All Rights Reserved.

# 复用公共导航项，中文仅覆盖在线演示的目标地址。
nav:
  - &nav_home
    Home: index.md
  - &nav_quick_start
    Quick Start: quick_start/index.md
  - &nav_usage
    Usage:
      - Usage: usage/index.md
      - WebUI: usage/webui.md
      - Document Library and Agents: usage/quick_usage.md
      - CLI Tools: usage/cli_tools.md
      - Third-party Integrations: usage/integrations.md
  - &nav_deployment
    Deployment:
      - Deployment: deployment/index.md
      - Tiers and Runtimes: usage/tiers.md
      - Extension Modules: quick_start/extension_modules.md
      - Models and Configuration: usage/model_source.md
      - Docker Deployment: quick_start/docker_deployment.md
      - Router Deployment: deployment/router.md
      - GPU and Engine Parameters: usage/advanced_cli_parameters.md
  - &nav_reference
    Reference:
      - Reference: reference/index.md
      - Python SDK: usage/sdk_api.md
      - First HTTP Request: usage/http_api.md
      - Tasks API: usage/tasks.md
      - Synchronous File Parse: usage/file_parse.md
      - Output File Format: reference/output_files.md
      - Developer Reference: reference/development.md
      - Migration to 4.0: reference/migration_4.md
      - Migration to 4.1: reference/migration_4_1.md
      - Legacy Platforms (MinerU <4): usage/compatibility.md
      - Changelog: reference/changelog.md
  - &nav_faq
    FAQ: faq/index.md
  - Demo: https://huggingface.co/spaces/opendatalab/MinerU


plugins:
  - search
  - i18n:
      reconfigure_material: true
      docs_structure: folder
      fallback_to_default: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          nav:
            - *nav_home
            - *nav_quick_start
            - *nav_usage
            - *nav_deployment
            - *nav_reference
            - *nav_faq
            - Demo: https://www.modelscope.cn/studios/OpenDataLab/MinerU
          nav_translations:
            Home: 主页
            Quick Start: 快速入门
            Extension Modules: 扩展模块安装
            Docker Deployment: Docker 部署
            Deployment: 部署与运维
            Router Deployment: Router 部署
            Usage: 使用指南
            Document Library and Agents: 文档库与 Agent 阅读
            WebUI: WebUI 操作指南
            CLI Tools: 命令行工具
            Tiers and Runtimes: 档位与运行环境
            Python SDK: Python SDK
            First HTTP Request: 第一次 HTTP 请求
            Tasks API: Tasks 异步接口
            Synchronous File Parse: 单文件同步解析
            Legacy Platforms (MinerU <4): 旧平台适配（MinerU <4）
            Migration to 4.0: 迁移到 4.0
            Migration to 4.1: 迁移到 4.1
            Models and Configuration: 模型下载与配置
            GPU and Engine Parameters: GPU 与引擎参数
            Third-party Integrations: 第三方集成
            Developer Reference: 开发参考
            FAQ: 常见问题解答
            Reference: 参考资料
            Output File Format: 输出文件格式
            Changelog: 更新日志
            Demo: 在线演示
  - mkdocs-video

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - def_list
  - gfm_admonition
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
