<style>
  .mineru-demo-header {
    --mineru-header-font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mineru-header-button-bg: #363636;
    padding: 24px;
    color: #ffffff;
  }
  .dark .mineru-demo-header {
    --mineru-header-button-bg: #2b2b2b;
  }
  .mineru-demo-header,
  .mineru-demo-header * {
    box-sizing: border-box;
  }
  /* 关闭 Gradio 排版后显式保留原有标题的字重与行高。 */
  .mineru-demo-header h1 {
    font-weight: 600;
    line-height: 1.3;
  }
  .mineru-demo-header a {
    color: inherit;
    text-decoration: none;
  }
  .mineru-demo-header .mineru-header-links {
    width: 100%;
  }
  /* 窄屏直接使用两列，避免自动换行产生三加一或第二行缩进。 */
  .mineru-demo-header .publication-links {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
  }
  .mineru-demo-header.is-wide .publication-links {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    max-width: 520px;
  }
  /* 链接与菜单触发器共用整格宽度和点击高度，图标不再额外携带右边距。 */
  .mineru-demo-header .link-block {
    display: block;
    min-width: 0;
    border-radius: 22px;
  }
  .mineru-demo-header .link-block .external-link {
    appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    width: 100%;
    height: 44px;
    min-height: 44px;
    margin: 0;
    padding: 0 8px;
    border: 1px solid transparent;
    border-radius: inherit;
    background: var(--mineru-header-button-bg);
    color: #ffffff;
    font: 400 14px/1.25 var(--mineru-header-font);
    letter-spacing: normal;
    text-decoration: none;
    white-space: nowrap;
    outline: none;
    box-shadow: none;
    /* 仅过渡颜色，避免继承 Gradio 的全属性动画导致字号和尺寸短暂变化。 */
    transition: background-color 120ms ease, color 120ms ease;
    cursor: pointer;
  }
  .mineru-demo-header .external-link:hover,
  .mineru-demo-header .external-link[aria-expanded="true"] {
    background: #484848;
  }
  .mineru-demo-header .mineru-header-label {
    display: block;
    font: inherit;
  }
  .mineru-demo-header svg {
    display: block;
  }
  .mineru-demo-header .external-link .icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 16px;
    width: 16px;
    height: 16px;
  }
  .mineru-demo-header .mineru-header-chevron {
    flex: 0 0 11px;
    width: 11px;
    height: 11px;
    opacity: 0.8;
  }
  .mineru-demo-header .icon svg {
    width: 16px;
    height: 16px;
  }
  /* Header 已自带内边距，去掉 Gradio 外层的重复留白，给极窄屏按钮保留空间。 */
  .block.mineru-header-html .html-container {
    padding: 0 !important;
  }
  .mineru-header-menu {
    position: relative;
  }
  .block.mineru-header-html,
  .block.mineru-header-html .html-container,
  .block.mineru-header-html .mineru-header-html {
    overflow: visible !important;
    position: relative !important;
    z-index: 100 !important;
  }
  .mineru-header-menu.is-open::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    height: 12px;
  }
  .mineru-header-popover {
    position: absolute;
    left: 0;
    top: calc(100% + 10px);
    z-index: 20;
    /* 按最长链接文字确定宽度，避免固定宽度产生过多左右留白。 */
    width: max-content;
    max-width: min(264px, var(--mineru-header-popover-max-width, calc(100vw - 64px)));
    padding: 7px;
    border: 1px solid #536079;
    border-radius: 10px;
    background: #172336;
    box-shadow: 0 8px 20px #001b4a44;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    /* 可见性立即切换，让快速重开时的键盘焦点不受过渡首帧阻挡。 */
    transition: opacity 120ms ease, transform 120ms ease;
    visibility: hidden;
  }
  .mineru-demo-header .mineru-model-popover {
    left: auto;
    right: 0;
  }
  .mineru-demo-header.is-wide .mineru-header-popover {
    left: 50%;
    right: auto;
    transform: translate(-50%, 8px);
  }
  .mineru-header-menu.is-open .mineru-header-popover {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
    visibility: visible;
  }
  .mineru-demo-header.is-wide .mineru-header-menu.is-open .mineru-header-popover {
    transform: translate(-50%, 0);
  }
  .mineru-demo-header .mineru-header-popover .mineru-header-popover-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 44px;
    padding: 9px 11px;
    border-radius: 5px;
    color: #f3f6fb;
    font: 400 14px/1.4 var(--mineru-header-font);
    letter-spacing: normal;
    text-align: left;
    text-decoration: none;
    white-space: normal;
    overflow-wrap: anywhere;
    transition: background-color 120ms ease;
  }
  .mineru-demo-header .mineru-header-popover-link:hover {
    background: #2b3e58;
  }
  .mineru-demo-header .mineru-header-popover-link svg {
    flex: 0 0 13px;
    width: 13px;
    height: 13px;
    opacity: 0.8;
  }
  .mineru-demo-header .mineru-header-popover-link:focus {
    outline: none;
  }
  .mineru-demo-header .external-link:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 2px;
  }
  .mineru-demo-header .mineru-header-popover-link:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: -2px;
  }
  @media (max-width: 420px) {
    .mineru-demo-header {
      padding: 20px 16px;
    }
  }
</style></head>

<body>
  <div class="mineru-demo-header" style="
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(45deg, #007bff 0%, #0056b3 100%);
      gap: 24px;
      border-radius: 8px;
    ">
    <div style="
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      ">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="
            font-size: 48px;
            color: #ffffff !important;
            margin: 0;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode',
              'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
          ">
          {{HEADER_TITLE}}
        </h1>
      </div>
    </div>

    <p style="
        margin: 0;
        line-height: 1.6rem;
        font-size: 16px;
        color: #ffffff !important;
        opacity: 0.8;
      ">
        {{HEADER_SUBTITLE}}<br>
        {{HEADER_SUPPORT_TEXT}}
        <a href="https://github.com/opendatalab/MinerU" target="_blank" style="display: inline-flex; align-items: center;">
          <img src="https://img.shields.io/github/stars/opendatalab/MinerU.svg" alt="{{HEADER_STARS_ALT}}" style="vertical-align: middle; position: relative; top: 5px;">
        </a>
    </p>
    <div class="mineru-header-links">
      <div class="publication-links">
        <!-- Code Link. -->
        <span class="link-block">
          <a href="https://github.com/opendatalab/MinerU" target="_blank" class="external-link button is-normal is-rounded is-dark" style="text-decoration: none; cursor: pointer">
            <span class="icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                <path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/>
              </svg>
            </span>
            <span class="mineru-header-label">{{HEADER_CODE_LINK}}</span>
          </a>
        </span>
        <!-- Model Links. -->
        <span class="link-block mineru-header-menu mineru-model-menu">
          <button type="button" class="external-link button is-normal is-rounded is-dark mineru-header-trigger mineru-model-trigger" style="text-decoration: none; cursor: pointer" aria-expanded="false" aria-controls="mineru-model-links">
            <span class="icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
                <path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>
              </svg>
            </span>
            <span class="mineru-header-label">{{HEADER_MODEL_LINK}}</span>
            <svg class="mineru-header-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <span class="mineru-header-popover mineru-model-popover" id="mineru-model-links" hidden>
            <a href="https://huggingface.co/opendatalab/MinerU2.5-Pro-2605-1.2B" target="_blank" class="mineru-header-popover-link mineru-model-popover-link">
              <span>{{HEADER_MODEL_HUGGINGFACE_LINK}}</span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
            </a>
            <a href="https://modelscope.cn/models/OpenDataLab/MinerU2.5-Pro-2605-1.2B" target="_blank" class="mineru-header-popover-link mineru-model-popover-link">
              <span>{{HEADER_MODEL_MODELSCOPE_LINK}}</span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
            </a>
          </span>
        </span>
        <!-- arXiv Links. -->
        <span class="link-block mineru-header-menu mineru-paper-menu">
          <button type="button" class="external-link button is-normal is-rounded is-dark mineru-header-trigger mineru-paper-trigger" style="text-decoration: none; cursor: pointer" aria-expanded="false" aria-controls="mineru-paper-links">
            <span class="icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
                <path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>
              </svg>
            </span>
            <span class="mineru-header-label">{{HEADER_PAPER_LINK}}</span>
            <svg class="mineru-header-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <span class="mineru-header-popover mineru-paper-popover" id="mineru-paper-links" hidden>
            <a href="https://arxiv.org/abs/2409.18839" target="_blank" class="mineru-header-popover-link mineru-paper-popover-link">
              <span>{{HEADER_PAPER_MINERU_REPORT}}</span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
            </a>
            <a href="https://arxiv.org/abs/2509.22186" target="_blank" class="mineru-header-popover-link mineru-paper-popover-link">
              <span>{{HEADER_PAPER_MINERU25_REPORT}}</span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
            </a>
            <a href="https://arxiv.org/abs/2604.04771" target="_blank" class="mineru-header-popover-link mineru-paper-popover-link">
              <span>{{HEADER_PAPER_MINERU25PRO_REPORT}}</span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
            </a>
          </span>
        </span>

        <!-- Homepage Link. -->
        <span class="link-block">
          <a href="https://mineru.net/?source=online" target="_blank" class="external-link button is-normal is-rounded is-dark" style="text-decoration: none; cursor: pointer">
            <span class="icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
                <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              </svg>
            </span>
            <span class="mineru-header-label">{{HEADER_HOMEPAGE_LINK}}</span>
          </a>
        </span>

      </div>
    </div>

    <!-- New Demo Links -->
  </div>


</body></html>
