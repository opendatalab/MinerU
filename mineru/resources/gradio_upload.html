<!-- 图标取自 Lucide 0.468.0，许可见 gradio_upload.LICENSE；SVG 随文字颜色适配主题。 -->
<label class="mineru-upload-target">
    <input type="file" accept="{{ACCEPT}}" aria-label="{{UPLOAD_LABEL}}"
           data-mineru-i18n-key="upload_drop" data-mineru-i18n-attr="aria-label" />
    <span class="mineru-upload-empty" aria-hidden="true">
        <span class="mineru-upload-actions">
            <span class="mineru-upload-action">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" x2="12" y1="3" y2="15" />
                </svg>
                {{UPLOAD_CHOOSE}}
            </span>
            <span class="mineru-upload-action">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false">
                    <path d="M12.034 12.681a.498.498 0 0 1 .647-.647l9 3.5a.5.5 0 0 1-.033.943l-3.444 1.068a1 1 0 0 0-.66.66l-1.067 3.443a.5.5 0 0 1-.943.033z" />
                    <path d="M5 3a2 2 0 0 0-2 2M19 3a2 2 0 0 1 2 2M5 21a2 2 0 0 1-2-2M9 3h1M9 21h2M14 3h1M3 9v1M21 9v2M3 14v1" />
                </svg>
                {{UPLOAD_DRAG}}
            </span>
            <span class="mineru-upload-action">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false">
                    <path d="M15 2H9a1 1 0 0 0-1 1v2c0 .6.4 1 1 1h6c.6 0 1-.4 1-1V3c0-.6-.4-1-1-1Z" />
                    <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2M16 4h2a2 2 0 0 1 2 2v2M11 14h10" />
                    <path d="m17 10 4 4-4 4" />
                </svg>
                {{UPLOAD_PASTE}}
            </span>
        </span>
        <span class="mineru-upload-types">
            <span class="mineru-upload-type">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false">
                    <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
                    <path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8" />
                </svg>
                {{UPLOAD_DOCUMENT}}
            </span>
            {{UPLOAD_OR}}
            <span class="mineru-upload-type">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                    <circle cx="9" cy="9" r="2" />
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                </svg>
                {{UPLOAD_IMAGE}}
            </span>
        </span>
    </span>
</label>
<div class="mineru-upload-file-row" hidden>
    <span class="mineru-upload-fill" aria-hidden="true"></span>
    <span class="mineru-upload-file-icon" aria-hidden="true">
        <svg class="mineru-upload-document-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
            <path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8" />
        </svg>
        <svg class="mineru-upload-image-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" focusable="false" hidden>
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
            <circle cx="9" cy="9" r="2" />
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
        </svg>
    </span>
    <span class="mineru-upload-details">
        <span class="mineru-upload-label"><span class="mineru-upload-stem"></span><span class="mineru-upload-extension"></span></span>
        <span class="mineru-upload-size"></span>
    </span>
    <span class="mineru-upload-indicator" aria-hidden="true">
        <span class="mineru-upload-percent"></span>
        <svg class="mineru-upload-complete" xmlns="http://www.w3.org/2000/svg" width="17" height="17"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" focusable="false" hidden><path d="m20 6-11 11-5-5" /></svg>
    </span>
    <button type="button" class="mineru-upload-remove" aria-label="Clear file" title="Clear file">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12" /></svg>
    </button>
    <span class="mineru-upload-meter" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100"></span>
</div>
<div class="mineru-upload-status" role="status"></div>
<button type="button" class="mineru-upload-retry" hidden></button>
