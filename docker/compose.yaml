name: mineru-forge

services:
  mineru-openai-server:
    build:
      context: ..
      dockerfile: docker/global/Dockerfile
    image: mineru-forge:latest
    container_name: mineru-forge-openai-server
    restart: always
    profiles: ["openai-server"]
    ports:
      - 8001:30000
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_PDF_RENDER_THREADS: "4"
      MINERU_API_MAX_CONCURRENT_REQUESTS: "3"
      MINERU_PROCESSING_WINDOW_SIZE: "64"
      MINERU_API_OUTPUT_ROOT: "/data/output-dev"
      MINERU_API_TASK_RETENTION_SECONDS: "86400"
      MINERU_API_TASK_CLEANUP_INTERVAL_SECONDS: "60"
    entrypoint: mineru-openai-server
    command:
      --host 0.0.0.0
      --port 30000
      # --gpu-memory-utilization 0.5  # If encountering VRAM shortage, reduce the KV cache size by this parameter; if VRAM issues persist, try lowering it further to `0.4` or below.
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]  # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]

  mineru-api:
    build:
      context: ..
      dockerfile: docker/global/Dockerfile
    image: mineru-forge:latest
    container_name: mineru-forge-api
    restart: always
    profiles: ["api"]
    ports:
      - 8001:8000
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_PDF_RENDER_THREADS: "4"
      MINERU_API_MAX_CONCURRENT_REQUESTS: "3"
      MINERU_PROCESSING_WINDOW_SIZE: "64"
      MINERU_API_OUTPUT_ROOT: "/data/output-dev"
      MINERU_API_TASK_RETENTION_SECONDS: "86400"
      MINERU_API_TASK_CLEANUP_INTERVAL_SECONDS: "60"
    entrypoint: mineru-api
    command:
      --host 0.0.0.0
      --port 8000
      # --allow-public-http-client  # Disabled by default; when binding to 0.0.0.0 or ::, this re-enables *-http-client backends and server_url. Enable only if you accept the SSRF risk.
      # parameters for vllm-engine
      # --gpu-memory-utilization 0.5  # If encountering VRAM shortage, reduce the KV cache size by this parameter; if VRAM issues persist, try lowering it further to `0.4` or below.
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]  # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]

  mineru-router:
    build:
      context: ..
      dockerfile: docker/global/Dockerfile
    image: mineru-forge:latest
    container_name: mineru-forge-router
    restart: always
    profiles: ["router"]
    ports:
      - 8001:8002
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_PDF_RENDER_THREADS: "4"
      MINERU_API_MAX_CONCURRENT_REQUESTS: "3"
      MINERU_PROCESSING_WINDOW_SIZE: "64"
      MINERU_API_OUTPUT_ROOT: "/data/output-dev"
      MINERU_API_TASK_RETENTION_SECONDS: "86400"
      MINERU_API_TASK_CLEANUP_INTERVAL_SECONDS: "60"
    entrypoint: mineru-router
    command:
      --host 0.0.0.0
      --port 8002
      --local-gpus auto
      # --allow-public-http-client  # Disabled by default; when binding to 0.0.0.0 or ::, this re-enables *-http-client backends and server_url. Enable only if you accept the SSRF risk.
      # To aggregate existing mineru-api services instead of starting local workers:
      # --local-gpus none
      # --upstream-url http://mineru-api:8000
      # --upstream-url http://mineru-api-2:8000
      # parameters for vllm-engine
      # --gpu-memory-utilization 0.5  # If encountering VRAM shortage, reduce the KV cache size by this parameter; if VRAM issues persist, try lowering it further to `0.4` or below.
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]  # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]

  mineru-gradio:
    build:
      context: ..
      dockerfile: docker/global/Dockerfile
    image: mineru-forge:latest
    container_name: mineru-forge-gradio
    restart: always
    profiles: ["gradio"]
    ports:
      - 8001:7860
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_PDF_RENDER_THREADS: "4"
      MINERU_API_MAX_CONCURRENT_REQUESTS: "3"
      MINERU_PROCESSING_WINDOW_SIZE: "64"
      MINERU_API_OUTPUT_ROOT: "/data/output-dev"
      MINERU_API_TASK_RETENTION_SECONDS: "86400"
      MINERU_API_TASK_CLEANUP_INTERVAL_SECONDS: "60"
    entrypoint: mineru-gradio
    command:
      --server-name 0.0.0.0
      --server-port 7860
      # --enable-api false  # If you want to disable the API, set this to false
      # --max-convert-pages 20  # If you want to limit the number of pages for conversion, set this to a specific number
      # parameters for vllm-engine
      # --gpu-memory-utilization 0.5  # If encountering VRAM shortage, reduce the KV cache size by this parameter; if VRAM issues persist, try lowering it further to `0.4` or below.
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]  # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]
