name: DocVortex boundary integration

on:
  workflow_dispatch:
    inputs:
      docvortex-wheel-url:
        description: Native ABI3 DocVortex wheel URL; mutually exclusive with docvortex-ref
        required: false
        type: string
      docvortex-ref:
        description: SHA or ref of myhloli/DocVortex to build; mutually exclusive with wheel URL
        required: false
        type: string
      utils-wheel-url:
        description: Optional mineru-vl-utils 2.0.1+ wheel URL for unpublished dependency validation
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  DOCVORTEX_COMPUTE_BACKEND: rust
  DOCVORTEX_PDF_RENDER_BACKEND: legacy

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      - name: Validate mutually exclusive engine inputs
        env:
          DOCVORTEX_WHEEL_URL: ${{ inputs.docvortex-wheel-url }}
          DOCVORTEX_REF: ${{ inputs.docvortex-ref }}
        run: |
          python - <<'PY'
          import os
          # 必须指定一种引擎来源，不能在输入缺失时回退到索引版本。
          wheel = os.environ["DOCVORTEX_WHEEL_URL"].strip()
          ref = os.environ["DOCVORTEX_REF"].strip()
          if bool(wheel) == bool(ref):
              raise SystemExit("Provide exactly one of docvortex-wheel-url or docvortex-ref")
          if ref and (ref != os.environ["DOCVORTEX_REF"] or any(char.isspace() for char in ref)):
              raise SystemExit("docvortex-ref must be a SHA or Git ref without whitespace")
          PY
      - name: Checkout selected engine revision
        if: ${{ inputs.docvortex-ref != '' }}
        uses: actions/checkout@v6
        with:
          repository: myhloli/DocVortex
          ref: ${{ inputs.docvortex-ref }}
          path: .boundary/docvortex-src
          persist-credentials: false
      - name: Read the selected revision's Rust toolchain
        if: ${{ inputs.docvortex-ref != '' }}
        id: rust-version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          # 使用引擎所声明的工具链；Python 3.10 无需为读取单一字段额外安装 TOML 包。
          text = Path(".boundary/docvortex-src/rust-toolchain.toml").read_text(encoding="utf-8")
          match = re.search(r'^\s*channel\s*=\s*["\']([A-Za-z0-9][A-Za-z0-9.+-]*)["\']', text, re.MULTILINE)
          if match is None:
              raise SystemExit("Selected DocVortex revision must declare a Rust toolchain channel")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"toolchain={match.group(1)}\n")
          PY
      - name: Install matching Rust toolchain
        if: ${{ inputs.docvortex-ref != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.toolchain }}
      - name: Build the selected native wheel
        if: ${{ inputs.docvortex-ref != '' }}
        env:
          DOCVORTEX_BUILD_NATIVE: '1'
        run: |
          uv build --wheel --python "$(python -c 'import sys; print(sys.executable)')" \
            --out-dir "$GITHUB_WORKSPACE/.boundary/wheelhouse" .boundary/docvortex-src
      - name: Download the supplied engine wheel
        if: ${{ inputs.docvortex-wheel-url != '' }}
        env:
          DOCVORTEX_WHEEL_URL: ${{ inputs.docvortex-wheel-url }}
        run: |
          python -m pip download --no-deps --only-binary=:all: \
            --dest .boundary/wheelhouse "$DOCVORTEX_WHEEL_URL"
      - name: Freeze the exact native artifact
        env:
          DOCVORTEX_REF: ${{ inputs.docvortex-ref }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          from zipfile import ZipFile
          # URL 与源码构建统一为一个本地 wheel，安装前拒绝纯 Python 或非 ABI3 产物。
          wheels = list(Path(".boundary/wheelhouse").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0].resolve()
          with ZipFile(wheel) as archive:
              metadata = [name for name in archive.namelist() if name.endswith(".dist-info/WHEEL")]
              assert len(metadata) == 1, metadata
              tags = [line for line in archive.read(metadata[0]).decode().splitlines() if line.startswith("Tag:")]
              assert tags and all("-abi3-" in tag for tag in tags), tags
              assert any(name.startswith("docvortex/_native") and name.endswith((".so", ".pyd")) for name in archive.namelist())
          ref = os.environ["DOCVORTEX_REF"]
          record = {
              "source": "ref" if ref else "wheel-url",
              "requested_ref": ref or None,
              "resolved_commit": subprocess.check_output(["git", "-C", ".boundary/docvortex-src", "rev-parse", "HEAD"], text=True).strip() if ref else None,
              "host_commit": os.environ["GITHUB_SHA"],
              "wheel": str(wheel),
              "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "wheel_tags": tags,
          }
          Path(".boundary/engine-artifact.json").write_text(json.dumps(record, indent=2), encoding="utf-8")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"DOCVORTEX_WHEEL={wheel}\n")
          PY
      - name: Install matching engine wheel and host
        env:
          UTILS_WHEEL_URL: ${{ inputs.utils-wheel-url }}
        run: |
          uv venv --python "$(python -c 'import sys; print(sys.executable)')"
          packages=("$DOCVORTEX_WHEEL" '.[test]' psutil)
          if [[ -n "$UTILS_WHEEL_URL" ]]; then packages+=("$UTILS_WHEEL_URL"); fi
          # 单次求解固定引擎产物，避免安装宿主时换成索引中的另一个 DocVortex。
          uv pip install "${packages[@]}"
          uv pip check
      - name: Verify installed native ABI3 provenance and protocol
        run: |
          if [[ -f .venv/Scripts/activate ]]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          python -I - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          from pathlib import Path
          import sysconfig
          from urllib.parse import urlsplit
          from urllib.request import url2pathname
          from zipfile import ZipFile
          import docvortex
          import docvortex._native as native
          import mineru
          from docvortex._compute_backend import backend_info
          # 隔离导入必须来自已安装 wheel 的 site-packages，而非两个源码 checkout。
          site_roots = {Path(sysconfig.get_paths()[name]).resolve() for name in ("purelib", "platlib")}
          origins = {"docvortex": Path(docvortex.__file__).resolve(), "native": Path(native.__file__).resolve(), "mineru": Path(mineru.__file__).resolve()}
          for name, path in origins.items():
              assert any(path.is_relative_to(root) for root in site_roots), (name, path, site_roots)
          info = backend_info()
          assert info["backend"] == "rust", info
          assert native.PROTOCOL_VERSION >= 15 and info["protocol"] == native.PROTOCOL_VERSION, info
          assert info["extension_sha256"] == hashlib.sha256(origins["native"].read_bytes()).hexdigest(), info
          artifact = json.loads(Path(".boundary/engine-artifact.json").read_text(encoding="utf-8"))
          distribution = importlib.metadata.distribution("docvortex")
          provenance = json.loads(distribution.read_text("direct_url.json") or "{}")
          def stream_hash(stream, algorithm="sha256"):
              """分块校验完整文件内容，避免原生扩展或字体资源引入大块临时分配。"""
              fingerprint = hashlib.new(algorithm)
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  fingerprint.update(chunk)
              return fingerprint.hexdigest()

          wheel = Path(artifact["wheel"]).resolve(strict=True)
          direct_url = urlsplit(provenance.get("url", ""))
          assert direct_url.scheme == "file" and direct_url.netloc in ("", "localhost"), provenance
          assert not direct_url.query and not direct_url.fragment, provenance
          installed_from = Path(url2pathname(direct_url.path)).resolve(strict=True)
          assert installed_from == wheel, (installed_from, wheel)
          with wheel.open("rb") as stream:
              assert stream_hash(stream) == artifact["wheel_sha256"], artifact
          # uv 的本地 wheel direct_url 允许 archive_info 为空；有声明摘要仍逐一验证。
          archive_info = provenance.get("archive_info", {})
          declared_hashes = dict(archive_info.get("hashes", {}))
          if archive_info.get("hash"):
              algorithm, value = archive_info["hash"].split("=", 1)
              assert algorithm not in declared_hashes or declared_hashes[algorithm] == value, archive_info
              declared_hashes[algorithm] = value
          for algorithm, expected in declared_hashes.items():
              with wheel.open("rb") as stream:
                  assert stream_hash(stream, algorithm) == expected.lower(), (algorithm, archive_info)
          # 独立比较归档与实际安装的每个包文件，覆盖代码、资源和原生扩展；不依赖 RECORD。
          package_root = origins["docvortex"].parent
          verified_paths = set()
          payload_fingerprint = hashlib.sha256()
          matched_package_files = matched_metadata_files = 0
          with ZipFile(wheel) as archive:
              package_entries = [entry for entry in archive.infolist() if not entry.is_dir() and entry.filename.startswith("docvortex/")]
              metadata_entries = [entry for entry in archive.infolist() if entry.filename.endswith(".dist-info/METADATA")]
              assert package_entries and len(metadata_entries) == 1, (len(package_entries), len(metadata_entries))
              entries = sorted(package_entries + metadata_entries, key=lambda entry: entry.filename)
              assert len({entry.filename for entry in entries}) == len(entries), "Duplicate wheel payload paths"
              for entry in entries:
                  installed = Path(distribution.locate_file(entry.filename)).resolve(strict=True)
                  assert any(installed.is_relative_to(root) for root in site_roots), installed
                  if entry.filename.startswith("docvortex/"):
                      assert installed.is_relative_to(package_root), installed
                      matched_package_files += 1
                  else:
                      matched_metadata_files += 1
                  with archive.open(entry) as expected_stream, installed.open("rb") as installed_stream:
                      expected_hash = stream_hash(expected_stream)
                      assert stream_hash(installed_stream) == expected_hash, (entry.filename, installed)
                  verified_paths.add(installed)
                  payload_fingerprint.update(entry.filename.encode("utf-8") + b"\0" + expected_hash.encode("ascii") + b"\n")
          assert origins["docvortex"] in verified_paths and origins["native"] in verified_paths, origins
          with wheel.open("rb") as stream:
              assert stream_hash(stream) == artifact["wheel_sha256"], "Wheel changed during payload verification"
          payload_verification = {
              "direct_url_matches_frozen_wheel": True,
              "frozen_wheel_sha256_verified": artifact["wheel_sha256"],
              "declared_archive_hashes_verified": declared_hashes,
              "matched_package_files": matched_package_files,
              "matched_metadata_files": matched_metadata_files,
              "loaded_native_extension_verified": True,
              "verified_payload_sha256": payload_fingerprint.hexdigest(),
              "scope": "All wheel docvortex/ files plus METADATA; installer-rewritten RECORD and generated pyc excluded",
          }
          wheel_metadata = distribution.read_text("WHEEL") or ""
          assert any(line.startswith("Tag:") and "-abi3-" in line for line in wheel_metadata.splitlines())
          record = {"versions": {name: importlib.metadata.version(name) for name in ("docvortex", "mineru")}, "origins": {name: str(path) for name, path in origins.items()}, "compute": info, "artifact": artifact, "payload_verification": payload_verification}
          Path(".boundary/installed-contract.json").write_text(json.dumps(record, indent=2), encoding="utf-8")
          print(json.dumps(record, indent=2))
          PY
      - name: Verify public contracts and deterministic inference replay
        run: |
          if [[ -f .venv/Scripts/activate ]]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          python -I -m pytest -q -o addopts='' -o pythonpath=tests/unittest --import-mode=importlib \
            tests/unittest/test_docvortex_import_boundary.py \
            tests/unittest/test_backend_architecture.py \
            tests/unittest/test_docvortex_protocol.py \
            tests/unittest/test_docvortex_routing.py \
            tests/unittest/test_pdf_text_styles.py \
            tests/unittest/test_pdf_analyze_block_content.py \
            tests/unittest/test_native_pdf_table_pipeline.py \
            tests/unittest/test_pdf_analyze_visual_blocks.py \
            tests/unittest/test_pdf_model_inputs.py \
            tests/unittest/test_pdf_cpu_reuse.py \
            tests/unittest/test_pdf_memory_lifecycle.py \
            tests/unittest/test_pdf_render_session_integration.py \
            tests/unittest/test_pdf_window_snapshots.py \
            tests/unittest/test_native_span_assignment.py \
            tests/unittest/test_flash_pdf_render_scheduling.py \
            tests/unittest/test_process_heap_memory.py
      - name: Retain exact wheel and installation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: docvortex-boundary-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            .boundary/wheelhouse/*.whl
            .boundary/engine-artifact.json
            .boundary/installed-contract.json
          if-no-files-found: warn
