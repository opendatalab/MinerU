name: Transformers 5 compatibility

on:
  pull_request:
    branches: [next]
  push:
    branches: [next]
  workflow_dispatch:
    inputs:
      docvortex-wheel-url:
        description: Optional DocVortex 0.4.x wheel URL for joint pre-release validation
        required: false
        type: string
      utils-wheel-url:
        description: Optional mineru-vl-utils 2.x wheel URL for joint pre-release validation
        required: false
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / Transformers ${{ matrix.transformers }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        transformers: ['5.10.1', '5.14.0', '5.16.1']
        include:
          - {os: ubuntu-latest, python: '3.10', transformers: '5.10.1', torch: '2.7.0', torchvision: '0.22.0'}
          - {os: windows-latest, python: '3.12', transformers: '5.10.1'}
          - {os: windows-latest, python: '3.12', transformers: '5.16.1'}
          - {os: macos-latest, python: '3.12', transformers: '5.10.1'}
          - {os: macos-latest, python: '3.12', transformers: '5.16.1'}
          - {os: macos-latest, python: '3.14', transformers: '5.16.1'}
          - {os: windows-latest, python: '3.14', transformers: '5.16.1'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies and optional joint-validation wheel
        env:
          UTILS_WHEEL_URL: ${{ inputs.utils-wheel-url }}
          DOCVORTEX_WHEEL_URL: ${{ inputs.docvortex-wheel-url }}
          TRANSFORMERS_VERSION: ${{ matrix.transformers }}
          TORCH_VERSION: ${{ matrix.torch }}
          TORCHVISION_VERSION: ${{ matrix.torchvision }}
        run: |
          uv venv
          if [[ -n "$DOCVORTEX_WHEEL_URL" ]]; then
            uv pip install "$DOCVORTEX_WHEEL_URL"
          fi
          if [[ -n "$UTILS_WHEEL_URL" ]]; then
            uv pip install "$UTILS_WHEEL_URL"
          fi
          if [[ -n "$TORCH_VERSION" ]]; then
            uv pip install "torch==$TORCH_VERSION" "torchvision==$TORCHVISION_VERSION"
          fi
          uv pip install '.[torch,test]' "transformers==$TRANSFORMERS_VERSION"
          uv pip check
      - name: Check real model graphs, cache and public import boundaries
        run: |
          if [[ -f .venv/Scripts/activate ]]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          python -m pytest -q -o addopts='' \
            tests/unittest/test_transformers5_models.py \
            tests/unittest/test_transformers5_runtime.py \
            tests/unittest/test_dependency_compatibility_check.py \
            tests/unittest/test_model_backend_selection.py \
            tests/unittest/test_pp_doclayoutv2_postprocess.py \
            tests/unittest/test_mfr_latex_utils.py \
            tests/unittest/test_vlm_config.py \
            tests/unittest/test_vlm_remote.py \
            tests/unittest/test_parser_model_preload.py \
            tests/unittest/test_models_download_utils.py \
            tests/unittest/test_pdf_memory_lifecycle.py

  dependency-resolution:
    name: Installation matrix / ${{ matrix.platform }} / Transformers ${{ matrix.transformers }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
        transformers: ['5.10.1', '5.14.0', '5.16.1']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Build wheels for metadata validation
        env:
          UTILS_WHEEL_URL: ${{ inputs.utils-wheel-url }}
          DOCVORTEX_WHEEL_URL: ${{ inputs.docvortex-wheel-url }}
        run: |
          python -m pip install build
          python -m build --wheel
          mkdir -p dependency-wheels
          python -m pip download --no-deps --dest dependency-wheels "${UTILS_WHEEL_URL:-mineru-vl-utils>=2,<3}"
          python -m pip download --no-deps --dest dependency-wheels "${DOCVORTEX_WHEEL_URL:-docvortex>=0.4.0,<0.5.0}"
      - name: Resolve base, torch, full and all on Python 3.10 through 3.14
        run: |
          python scripts/check_transformers5_dependencies.py \
            --mineru-wheel dist/*.whl --utils-wheel dependency-wheels/mineru_vl_utils-*.whl \
            --docvortex-wheel dependency-wheels/docvortex-*.whl --utils-matrix --check-wheels \
            --platform '${{ matrix.platform }}' --transformers '${{ matrix.transformers }}' \
            --output dependency-matrix.json
      - name: Reject unsupported vLLM 0.19.1 on Python 3.14
        if: matrix.platform == 'linux' && matrix.transformers == '5.16.1'
        run: |
          python scripts/check_transformers5_dependencies.py \
            --mineru-wheel dist/*.whl --utils-wheel dependency-wheels/mineru_vl_utils-*.whl \
            --docvortex-wheel dependency-wheels/docvortex-*.whl \
            --platform linux --python 3.14 --extras full \
            --requirement 'vllm==0.19.1' --expect-failure --check-wheels \
            --output vllm-python314-rejection.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependencies-${{ matrix.platform }}-${{ matrix.transformers }}
          path: |
            dependency-matrix.json
            vllm-python314-rejection.json
